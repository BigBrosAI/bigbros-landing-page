<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700"><defs>
<filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-opacity="0.18"/></filter>
<filter id="lift" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#0B2E23" flood-opacity="0.35"/></filter>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#BEF264" stop-opacity="0.35"/><stop offset="1" stop-color="#BEF264" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity="0.08"/></pattern>
<pattern id="dotsd" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#0B2E23" fill-opacity="0.08"/></pattern>
</defs><rect width="1600" height="700" fill="#ECFDF3"/><rect width="1600" height="700" fill="url(#dotsd)"/><text x="800" y="100" text-anchor="middle" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="40" font-weight="800" fill="#0B1F17">Your chatbot voice card</text><g transform="translate(90 170)" filter="url(#lift)"><rect width="335" height="420" rx="28" fill="#0B2E23"/><text x="34" y="70" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#BEF264">We sound</text><text x="34" y="130" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="21" fill="#fff">Warm, quick, helpful.</text><text x="34" y="164" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="21" fill="#fff">Like your best staff</text><text x="34" y="198" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="21" fill="#fff">member on a good day.</text></g><g transform="translate(455 170)" filter="url(#lift)"><rect width="335" height="420" rx="28" fill="#fff"/><text x="34" y="70" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#16A34A">We say</text><text x="34" y="130" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="21" fill="#41524A">“Got it”, “Happy to</text><text x="34" y="164" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="21" fill="#41524A">help”, the customer’s</text><text x="34" y="198" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="21" fill="#41524A">name, short sentences.</text></g><g transform="translate(820 170)" filter="url(#lift)"><rect width="335" height="420" rx="28" fill="#fff"/><text x="34" y="70" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#16A34A">We avoid</text><text x="34" y="130" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="21" fill="#41524A">“Kindly”, “Your query”,</text><text x="34" y="164" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="21" fill="#41524A">walls of text, jargon,</text><text x="34" y="198" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="21" fill="#41524A">ALL CAPS.</text></g><g transform="translate(1185 170)" filter="url(#lift)"><rect width="335" height="420" rx="28" fill="#fff"/><text x="34" y="70" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#16A34A">We hand over</text><text x="34" y="130" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="21" fill="#41524A">When someone is upset,</text><text x="34" y="164" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="21" fill="#41524A">confused or ready to buy</text><text x="34" y="198" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="21" fill="#41524A">big.</text></g></svg>