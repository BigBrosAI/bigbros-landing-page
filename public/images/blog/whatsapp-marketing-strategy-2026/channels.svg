<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800"><defs>
<filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-opacity="0.18"/></filter>
<filter id="lift" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#0B2E23" flood-opacity="0.35"/></filter>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#BEF264" stop-opacity="0.35"/><stop offset="1" stop-color="#BEF264" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity="0.08"/></pattern>
<pattern id="dotsd" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#0B2E23" fill-opacity="0.08"/></pattern>
</defs><rect width="1600" height="800" fill="#ECFDF3"/><rect width="1600" height="800" fill="url(#dotsd)"/><text x="800" y="110" text-anchor="middle" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="40" font-weight="800" fill="#0B1F17">Where your message is most likely to be seen</text><g transform="translate(160 220)" filter="url(#lift)"><rect width="1280" height="130" rx="28" fill="#fff"/><text x="40" y="58" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#0B1F17">WhatsApp</text><text x="40" y="94" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="18" fill="#41524A">Opened in the chat app customers check all day</text><rect x="560" y="48" width="660" height="34" rx="17" fill="#EEF3F0"/><rect x="560" y="48" width="607.2" height="34" rx="17" fill="#16A34A"/></g><g transform="translate(160 390)" filter="url(#lift)"><rect width="1280" height="130" rx="28" fill="#fff"/><text x="40" y="58" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#0B1F17">SMS</text><text x="40" y="94" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="18" fill="#41524A">Often lost among OTPs and promotions</text><rect x="560" y="48" width="660" height="34" rx="17" fill="#EEF3F0"/><rect x="560" y="48" width="363.00000000000006" height="34" rx="17" fill="#94A39B"/></g><g transform="translate(160 560)" filter="url(#lift)"><rect width="1280" height="130" rx="28" fill="#fff"/><text x="40" y="58" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#0B1F17">Email</text><text x="40" y="94" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="18" fill="#41524A">Competes with a crowded inbox</text><rect x="560" y="48" width="660" height="34" rx="17" fill="#EEF3F0"/><rect x="560" y="48" width="230.99999999999997" height="34" rx="17" fill="#94A39B"/></g><text x="800" y="760" text-anchor="middle" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="18" fill="#41524A">Illustrative comparison of attention, not measured data.</text></svg>