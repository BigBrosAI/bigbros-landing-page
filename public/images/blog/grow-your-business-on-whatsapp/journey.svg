<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700"><defs>
<filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-opacity="0.18"/></filter>
<filter id="lift" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#0B2E23" flood-opacity="0.35"/></filter>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#BEF264" stop-opacity="0.35"/><stop offset="1" stop-color="#BEF264" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity="0.08"/></pattern>
<pattern id="dotsd" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#0B2E23" fill-opacity="0.08"/></pattern>
</defs><rect width="1600" height="700" fill="#ECFDF3"/><rect width="1600" height="700" fill="url(#dotsd)"/><text x="800" y="110" text-anchor="middle" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="40" font-weight="800" fill="#0B1F17">The WhatsApp customer journey</text><path d="M410 380 h40" stroke="#16A34A" stroke-width="4" stroke-dasharray="6 6"/><g transform="translate(80 200)" filter="url(#lift)"><rect width="330" height="360" rx="30" fill="#fff"/>
<text x="36" y="80" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="52" font-weight="800" fill="#16A34A">01</text>
<text x="36" y="160" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#0B1F17">Get found</text><text x="36" y="205" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="19" fill="#41524A">QR codes, chat button,</text><text x="36" y="233" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="19" fill="#41524A">wa.me links, ads</text></g><path d="M780 380 h40" stroke="#16A34A" stroke-width="4" stroke-dasharray="6 6"/><g transform="translate(450 200)" filter="url(#lift)"><rect width="330" height="360" rx="30" fill="#fff"/>
<text x="36" y="80" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="52" font-weight="800" fill="#16A34A">02</text>
<text x="36" y="160" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#0B1F17">Reply instantly</text><text x="36" y="205" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="19" fill="#41524A">Chatbot greets and</text><text x="36" y="233" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="19" fill="#41524A">qualifies 24/7</text></g><path d="M1150 380 h40" stroke="#16A34A" stroke-width="4" stroke-dasharray="6 6"/><g transform="translate(820 200)" filter="url(#lift)"><rect width="330" height="360" rx="30" fill="#fff"/>
<text x="36" y="80" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="52" font-weight="800" fill="#16A34A">03</text>
<text x="36" y="160" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#0B1F17">Close in chat</text><text x="36" y="205" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="19" fill="#41524A">Catalogue, payment</text><text x="36" y="233" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="19" fill="#41524A">links, WhatsApp Pay</text></g><g transform="translate(1190 200)" filter="url(#lift)"><rect width="330" height="360" rx="30" fill="#0B2E23"/>
<text x="36" y="80" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="52" font-weight="800" fill="#BEF264">04</text>
<text x="36" y="160" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#fff">Bring them back</text><text x="36" y="205" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="19" fill="#ffffffb3">Broadcasts, reminders,</text><text x="36" y="233" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="19" fill="#ffffffb3">offers</text></g></svg>