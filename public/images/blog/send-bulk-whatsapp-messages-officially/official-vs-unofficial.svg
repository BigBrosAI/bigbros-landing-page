</defs><rect width="1600" height="760" fill="#ECFDF3"/><rect width="1600" height="760" fill="url(#dotsd)"/><text x="800" y="100" text-anchor="middle" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="40" font-weight="800" fill="#0B1F17">Official API vs unofficial bulk senders</text><g transform="translate(130 170)" filter="url(#lift)"><rect width="620" height="520" rx="28" fill="#0B2E23"/><text x="40" y="70" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#fff">Official WhatsApp Business API</text><circle cx="56" cy="140" r="18" fill="#BEF264"/><path d="M47 140 l7 7 l12 -13" stroke="#0B2E23" stroke-width="4" fill="none" stroke-linecap="round"/><text x="92" y="148" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="22" font-weight="600" fill="#fff">Approved by Meta</text><circle cx="56" cy="216" r="18" fill="#BEF264"/><path d="M47 216 l7 7 l12 -13" stroke="#0B2E23" stroke-width="4" fill="none" stroke-linecap="round"/><text x="92" y="224" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="22" font-weight="600" fill="#fff">Your verified business number</text><circle cx="56" cy="292" r="18" fill="#BEF264"/><path d="M47 292 l7 7 l12 -13" stroke="#0B2E23" stroke-width="4" fill="none" stroke-linecap="round"/><text x="92" y="300" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="22" font-weight="600" fill="#fff">Templates reviewed before sending</text><circle cx="56" cy="368" r="18" fill="#BEF264"/><path d="M47 368 l7 7 l12 -13" stroke="#0B2E23" stroke-width="4" fill="none" stroke-linecap="round"/><text x="92" y="376" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="22" font-weight="600" fill="#fff">Delivery and read reports</text><circle cx="56" cy="444" r="18" fill="#BEF264"/><path d="M47 444 l7 7 l12 -13" stroke="#0B2E23" stroke-width="4" fill="none" stroke-linecap="round"/><text x="92" y="452" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="22" font-weight="600" fill="#fff">Buttons, links and payments</text></g><g transform="translate(850 170)" filter="url(#lift)"><rect width="620" height="520" rx="28" fill="#fff"/><text x="40" y="70" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#0B1F17">Unofficial bulk tools</text><circle cx="56" cy="140" r="18" fill="#FEE2E2"/><path d="M49 133 l14 14 M63 133 l-14 14" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/><text x="92" y="148" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="22" font-weight="600" fill="#41524A">Breaks WhatsApp’s terms</text><circle cx="56" cy="216" r="18" fill="#FEE2E2"/><path d="M49 209 l14 14 M63 209 l-14 14" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/><text x="92" y="224" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="22" font-weight="600" fill="#41524A">Numbers get banned, often fast</text><circle cx="56" cy="292" r="18" fill="#FEE2E2"/><path d="M49 285 l14 14 M63 285 l-14 14" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/><text x="92" y="300" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="22" font-weight="600" fill="#41524A">No opt-out handling</text><circle cx="56" cy="368" r="18" fill="#FEE2E2"/><path d="M49 361 l14 14 M63 361 l-14 14" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/><text x="92" y="376" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="22" font-weight="600" fill="#41524A">No reliable reporting</text><circle cx="56" cy="444" r="18" fill="#FEE2E2"/><path d="M49 437 l14 14 M63 437 l-14 14" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/><text x="92" y="452" font-family="'Plus Jakarta Sans','Inter',Arial,Helvetica,sans-serif" font-size="22" font-weight="600" fill="#41524A">Risks your brand’s reputation</text></g></svg>